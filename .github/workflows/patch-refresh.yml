name: Patch refresh button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # iPhone home-screen icon
          icon = '<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">'
          if icon not in s:
              s = s.replace('<title>全球開荒佛堂互動地圖</title>', '<title>全球開荒佛堂互動地圖</title>\n' + icon)

          # Refresh button styling: right side of statistics row
          css = '''
.refresh-data-btn {
  margin-left: auto; align-self: center; flex: 0 0 auto;
  width: calc(34px * var(--hud-scale)); height: calc(34px * var(--hud-scale));
  border-radius: 50%; border: 1.5px solid #ffd700;
  background: rgba(255, 215, 0, 0.12); color: #ffd700;
  display: flex; align-items: center; justify-content: center;
  font-size: calc(20px * var(--hud-scale)); font-weight: 900;
  line-height: 1; cursor: pointer; user-select: none;
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.18);
}
.refresh-data-btn:active { background: #ffd700; color: #0f172a; transform: scale(0.94); }
'''
          if '.refresh-data-btn {' not in s:
              s = s.replace('.stat-item { display: flex; flex-direction: column; }', css + '\n.stat-item { display: flex; flex-direction: column; }')

          # Refresh button placed in the blank area at right of the numeric statistics row
          button = '''    <button class="refresh-data-btn" onclick="forceRefresh()" title="重新整理最新資料" aria-label="重新整理最新資料">↻</button>\n'''
          stats_anchor = '''    <div class="stat-item">\n      <span class="stat-num" id="stat-masters">-</span>\n      <span class="stat-lbl">點傳師</span>\n    </div>\n'''
          if 'class="refresh-data-btn"' not in s:
              if stats_anchor not in s:
                  raise SystemExit('stats anchor not found')
              s = s.replace(stats_anchor, stats_anchor + button, 1)

          # Force a fresh page URL; loadMapData already cache-busts data.json with a timestamp
          js = '''
function forceRefresh() {
  const url = new URL(window.location.href);
  url.searchParams.set('_refresh', Date.now().toString());
  window.location.replace(url.toString());
}

'''
          if 'function forceRefresh()' not in s:
              marker = '// 💡 核心優化：跨裝置通用收合開關機制'
              if marker not in s:
                  raise SystemExit('JS insertion anchor not found')
              s = s.replace(marker, js + marker, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patch and remove one-time workflow
        run: |
          rm -f .github/workflows/patch-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-refresh.yml
          git commit -m "Add iPhone icon link and refresh button" || exit 0
          git push
