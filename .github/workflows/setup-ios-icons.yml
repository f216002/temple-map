name: Setup iPhone icons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-ios-icons.yml'
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate 512 icon and patch head
        run: |
          set -e
          mkdir -p icons
          if command -v convert >/dev/null 2>&1; then
            convert icons/apple-touch-icon.png -resize 512x512! -alpha off icons/icon-512.png
          elif command -v magick >/dev/null 2>&1; then
            magick icons/apple-touch-icon.png -resize 512x512! -alpha off icons/icon-512.png
          else
            cp icons/icon-192.png icons/icon-512.png
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('<head>')+len('<head>')
          title='全球開荒佛堂地圖'
          block='''
  <meta name="description" content="全球開荒佛堂與開荒點傳師互動地圖">
  <meta name="theme-color" content="#0b4f8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="全球開荒佛堂">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=20260912-3">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=20260912-3">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=20260912-3">
  <link rel="manifest" href="manifest.webmanifest?v=20260912-3">
'''
          # Remove all previous icon / manifest / Apple web-app meta lines, preserving unrelated head content.
          lines=s.splitlines()
          remove_keys=('rel="apple-touch-icon"','rel="apple-touch-icon-precomposed"','rel="icon"','rel="manifest"','name="theme-color"','name="apple-mobile-web-app-capable"','name="apple-mobile-web-app-status-bar-style"','name="apple-mobile-web-app-title"','name="description"')
          lines=[line for line in lines if not any(k in line for k in remove_keys)]
          s='\n'.join(lines)+'\n'
          s=s.replace('<head>\n','<head>\n'+block,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm -f .github/workflows/setup-ios-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest icons/ .github/workflows/setup-ios-icons.yml
          git commit -m "Configure verified iPhone home screen icons" || exit 0
          git push
