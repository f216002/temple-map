name: Fix iPhone icon cache
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-icon-cache.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update icon references
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">'
          new='''<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v2.png?v=20260912-2">\n<link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon-precomposed.png?v=20260912-2">\n<link rel="icon" type="image/png" sizes="180x180" href="./apple-touch-icon-v2.png?v=20260912-2">'''
          if old not in s:
              raise SystemExit('icon link not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use cache-busted iPhone icon" || exit 0
          git push