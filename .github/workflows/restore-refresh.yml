name: Restore refresh button
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-refresh.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore iPhone head metadata and refresh button
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Keep the now-working iPhone icon configuration present in the live HTML.
          if 'name="apple-mobile-web-app-capable"' not in s:
              block='''  <meta name="description" content="全球開荒佛堂與開荒點傳師互動地圖">\n  <meta name="theme-color" content="#0b4f8a">\n  <meta name="apple-mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-status-bar-style" content="default">\n  <meta name="apple-mobile-web-app-title" content="全球開荒佛堂">\n  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=20260912-4">\n  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=20260912-4">\n  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=20260912-4">\n  <link rel="manifest" href="manifest.webmanifest?v=20260912-4">\n'''
              s=s.replace('<head>\n','<head>\n'+block,1)

          # Refresh button style.
          if '.refresh-data-btn {' not in s:
              css='''\n.refresh-data-btn {\n  margin-left: auto; align-self: center; flex: 0 0 auto;\n  width: calc(34px * var(--hud-scale)); height: calc(34px * var(--hud-scale));\n  border-radius: 50%; border: 1.5px solid #ffd700;\n  background: rgba(255, 215, 0, 0.12); color: #ffd700;\n  display: flex; align-items: center; justify-content: center;\n  font-size: calc(20px * var(--hud-scale)); font-weight: 900;\n  line-height: 1; cursor: pointer; user-select: none;\n  box-shadow: 0 0 10px rgba(255, 215, 0, 0.18);\n}\n.refresh-data-btn:active { background: #ffd700; color: #0f172a; transform: scale(0.94); }\n'''
              s=s.replace('.stat-item { display: flex; flex-direction: column; }',css+'\n.stat-item { display: flex; flex-direction: column; }',1)

          # Button goes on the SECOND statistics row, to the right of the numbers.
          if 'class="refresh-data-btn"' not in s:
              anchor='''    <div class="stat-item">\n      <span class="stat-num" id="stat-masters">-</span>\n      <span class="stat-lbl">點傳師</span>\n    </div>\n'''
              if anchor not in s:
                  raise SystemExit('Statistics-row anchor not found')
              button='''    <button class="refresh-data-btn" onclick="forceRefresh()" title="重新整理最新資料" aria-label="重新整理最新資料">↻</button>\n'''
              s=s.replace(anchor,anchor+button,1)

          # Force full page reload with a unique URL; loadMapData also cache-busts data.json.
          if 'function forceRefresh()' not in s:
              marker='// 💡 核心優化：跨裝置通用收合開關機制'
              fn='''function forceRefresh() {\n  const url = new URL(window.location.href);\n  url.searchParams.set('_refresh', Date.now().toString());\n  window.location.replace(url.toString());\n}\n\n'''
              if marker not in s:
                  raise SystemExit('JavaScript anchor not found')
              s=s.replace(marker,fn+marker,1)

          p.write_text(s,encoding='utf-8')
      - name: Commit restored UI
        run: |
          rm -f .github/workflows/restore-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-refresh.yml
          git commit -m "Restore refresh button and preserve iPhone icon setup" || exit 0
          git push
